# ============================================================
# DANH SACH TRANG. Moi trang la 1 khoi bat dau bang "- id:".
# Giu dung thut le: "- id:" thut 2 dau cach, cac dong duoi thut 4.
#
#   id:        ten ngan, KHONG trung nhau (chu thuong, so, gach ngang)
#   program:   ten chuong trinh (hien trong tin nhan Telegram)
#   page_type: overview / fee / deadline / requirement
#   url:       link trang CHINH THUC cua truong
#   selector:  null = lay ca trang. Chi them khi van bi bao dong gia.
#   filter:    (tuy chon) "none" = so sanh ca trang, khong loc tu khoa
# ============================================================
pages:
  - id: klu-glscm
    program: KLU - MSc Global Logistics & SCM
    page_type: overview
    url: https://www.klu.org/master-logistics/
    selector: null

